name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install (CPU-only torch)
        run: pip install -r requirements-dev.txt

      # The slow tests download and run RoBERTa / BERTopic; run those locally (`pytest -v`).
      - name: Fast tests
        run: pytest -m "not slow" -v
